spring.application.name=dreamworld-api

# Porta: o Render injeta PORT (padrão 10000). Localmente continua 8080.
server.port=${PORT:8080}

# H2 Console — desligado em produção por segurança (ligar com H2_CONSOLE_ENABLED=true)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

# JPA — SQL desligado por padrão em produção (reduz log/ruído)
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# Healthcheck usado pelo Render
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Swagger UI — ordena tags e operações
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/api-docs
spring.hateoas.mediatype.hal-forms.enabled=true

# CORS — em produção preencher CORS_ALLOWED_ORIGINS com a URL do frontend
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:4200}

# ── Assistente de Estilo (IA generativa — Gemini) ───────────────────────────
# A chave NUNCA fica hardcoded aqui: é lida da variável de ambiente
# GEMINI_API_KEY. Se a variável não existir, o valor fica em branco e a API
# responde 503 de forma controlada (ver GeminiClient) em vez de vazar erro cru.
gemini.api-key=${GEMINI_API_KEY:}
gemini.base-url=https://generativelanguage.googleapis.com
# Modelo pode ser trocado sem recompilar via variável de ambiente GEMINI_MODEL.
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
gemini.timeout-ms=${GEMINI_TIMEOUT_MS:30000}

# ── Imagem do look (Nano Banana / Gemini image generation) ──────────────────
# Modelo de imagem usado para desenhar a Barbie com o look gerado acima.
gemini.image-model=${GEMINI_IMAGE_MODEL:gemini-nano-banana-2.1}
# Geração de imagem costuma ser mais lenta que texto, por isso o timeout é maior.
gemini.image-timeout-ms=${GEMINI_IMAGE_TIMEOUT_MS:90000}
