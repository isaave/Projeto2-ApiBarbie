# Render Blueprint — Barbie Dreamworld API (backend)
# O frontend está num repositório separado e é publicado no GitHub Pages.

services:
  - type: web
    # Nome/slug do serviço já existente — preserva a URL pública:
    # https://projeto2-apibarbie.onrender.com
    name: projeto2-apibarbie
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      # Segredo: preenchido no dashboard do Render (nunca no repositório)
      - key: GEMINI_API_KEY
        sync: false
      # Origens explícitas do frontend separado, separadas por vírgula.
      # Não usar "*" em produção: a API usa allowCredentials=true.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_IMAGE_MODEL
        value: gemini-nano-banana-2.1
      - key: GEMINI_TIMEOUT_MS
        value: "30000"
      - key: GEMINI_IMAGE_TIMEOUT_MS
        value: "90000"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      - key: OPENAPI_SERVER_URL
        value: https://projeto2-apibarbie.onrender.com
      # O Render termina TLS e repassa X-Forwarded-For. Habilite apenas em
      # ambientes onde esse header vem de um proxy de confiança.
      - key: APP_TRUST_PROXY_HEADERS
        value: "true"
      - key: RATE_LIMIT_READ_CAPACITY
        value: "10"
      - key: RATE_LIMIT_WRITE_CAPACITY
        value: "5"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
